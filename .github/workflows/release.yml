name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Run tests
        run: pytest --cov=custom_components/rain_radar_hub

  release:
    name: Release rain_radar_hub
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Create zip package
        run: |
          cd "${{ github.workspace }}/custom_components/rain_radar_hub"
          zip rain_radar_hub.zip -r ./

      - name: Upload zip to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/custom_components/rain_radar_hub/rain_radar_hub.zip
